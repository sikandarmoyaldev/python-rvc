[project]
name = "sikandarmoyaldev-rvc"
version = "0.0.3"
description = "Lightweight, WebUI-free RVC inference and training engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sikandar", email = "sikandar.moyal.dev@gmail.com"}
]
dependencies = [
    "einops>=0.8.2",
    "faiss-cpu>=1.15.0",
    "ffmpeg-python>=0.2.0",
    "huggingface-hub>=1.27.0",
    "librosa>=0.11.0",
    "local-attention>=1.11.2",
    "numpy>=2.4.6",
    "praat-parselmouth>=0.4.7",
    "pyworld>=0.3.5",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchfcpe>=0.0.4",
    "transformers>=5.15.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "ruff>=0.16.3",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/sikandarmoyaldev/python-rvc"
Repository = "https://github.com/sikandarmoyaldev/python-rvc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rvc", "src/infer", "src/configs", "src/i18n", "src/tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
# Exclude the copied RVC engine folders and standard Python directories
exclude = [
    "src/configs",
    "src/i18n",
    "src/infer",
    "src/tools",
    ".venv",
    "__pycache__",
    "node_modules",
]

# Optional: Set the line length to match standard Python formatting
line-length = 88
